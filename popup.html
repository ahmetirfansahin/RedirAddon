<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedirAddon</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo-box">
        <img src="icons/icon48.png" alt="RedirAddon Logo" width="32" height="32">
        <div class="title-group">
          <h1>RedirAddon</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
      <div class="status-badge active">Aktif</div>
    </div>

    <p class="desc">
      Chrome Web Store mağazasında incelenen eklentileri otomatik olarak Firefox Add-ons (AMO) üzerinde sorgular ve tek tıkla yönlendirir.
    </p>

    <div class="info-card">
      <div class="info-row">
        <span class="label">Hedef:</span>
        <span class="val">chromewebstore.google.com</span>
      </div>
      <div class="info-row">
        <span class="label">AMO API:</span>
        <span class="val status-ok">Bağlı (v5 REST)</span>
      </div>
    </div>

    <div class="actions">
      <a href="https://addons.mozilla.org" target="_blank" class="btn btn-amo">
        Firefox AMO Mağazası
      </a>
      <a href="https://chromewebstore.google.com" target="_blank" class="btn btn-cws">
        Chrome Web Mağazası
      </a>
    </div>

    <div class="footer">
      <span>RedirAddon &bull; Açık Kaynak Eklenti</span>
    </div>
  </div>
</body>
</html>
